# Local development services. Postgres is on 5433 so it doesn't clash with a
# locally installed Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: lodgemart-postgres
    environment:
      POSTGRES_USER: lodgemart
      POSTGRES_PASSWORD: lodgemart
      POSTGRES_DB: lodgemart_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lodgemart -d lodgemart_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lodgemart-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
