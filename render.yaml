# Render Blueprint for the LodgeMart API (https://render.com/docs/blueprint-spec).
# Render → New → Blueprint → pick this repo/branch. Every secret below is marked
# sync: false, so Render asks for it in the dashboard; nothing secret lives in git.
# Full walkthrough: docs/DEPLOYMENT.md
services:
  - type: web
    name: lodgemart-api
    runtime: node
    rootDir: server
    # Free plan for the sandbox trial: it sleeps after 15 min idle (first request ~30 s,
    # unpaid-order expiry timer pauses). Before real customers switch to `starter` and move
    # `npx prisma migrate deploy` from buildCommand into `preDeployCommand`.
    plan: free
    region: frankfurt        # closest Render region to Nigeria
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL          # Supabase session pooler URI (no ?sslmode)
        sync: false
      - key: MIGRATE_DATABASE_URL  # same URI + ?sslmode=require (used by prisma migrate)
        sync: false
      - key: DATABASE_SSL
        value: verify
      - key: DATABASE_CA_CERT      # Supabase → Database settings → SSL → download certificate (paste PEM)
        sync: false
      - key: REDIS_URL             # Upstash rediss:// URL
        sync: false
      - key: JWT_SECRET            # 96 hex chars: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        value: https://lodge-mart.vercel.app
      # Monnify (Developer → API Keys & Contracts). Sandbox first: MK_TEST_ key + sandbox URL.
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_WALLET_ACCOUNT_NUMBER   # Disbursements → wallet account (vendor payouts are sent from it)
        sync: false
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      - key: MONNIFY_REDIRECT_URL
        value: https://lodge-mart.vercel.app/orders
      - key: CLOUDINARY_URL
        sync: false
