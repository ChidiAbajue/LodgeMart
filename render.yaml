# Render Blueprint for the LodgeMart API (https://render.com/docs/blueprint-spec).
# Render → New → Blueprint → pick this repo (branch master). Render creates the API,
# a Postgres database and a Redis (Key Value) store, and wires them together.
# You only paste the Monnify and Cloudinary keys (and the first admin login).
# Nothing secret lives in git: every secret is `sync: false` (asked in the dashboard)
# or generated by Render.
#
# Free plans for the sandbox trial:
#   - the API sleeps after 15 min idle (first request ~30 s; the unpaid-order expiry timer pauses)
#   - the free Postgres database EXPIRES 30 days after creation: upgrade it (Basic) or move to
#     Supabase (docs/DEPLOYMENT.md) before real customers.
# Full walkthrough: docs/DEPLOYMENT.md

databases:
  - name: lodgemart-db
    plan: free
    region: frankfurt          # closest Render region to Nigeria
    databaseName: lodgemart
    user: lodgemart
    ipAllowList: []            # private network only: no access from the internet

services:
  - type: keyvalue             # Redis: rate limits, logout, PIN lock
    name: lodgemart-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction   # never silently drop rate-limit / logout keys
    ipAllowList: []            # private network only

  - type: web
    name: lodgemart-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # On every start: apply migrations, add missing zones/hubs/slots/products (never
    # overwrites), and create the first admin if ADMIN_EMAIL + ADMIN_PASSWORD are set.
    startCommand: npm run release && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lodgemart-db
          property: connectionString   # internal URL on Render's private network
      - key: DATABASE_SSL
        value: "off"                   # private network (allowed only for dot-less internal hosts)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lodgemart-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true            # 256-bit random, made by Render
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        value: https://lodge-mart.vercel.app
      # Monnify (Developer → API Keys & Contracts). Sandbox first: MK_TEST_ key + sandbox URL.
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false
      - key: MONNIFY_WALLET_ACCOUNT_NUMBER   # Disbursements → wallet account (vendor payouts are sent from it)
        sync: false
      - key: MONNIFY_BASE_URL
        value: https://sandbox.monnify.com
      - key: MONNIFY_REDIRECT_URL
        value: https://lodge-mart.vercel.app/orders
      - key: CLOUDINARY_URL                  # Cloudinary dashboard → "API environment variable"
        sync: false
      # First admin login, created on start. After you've signed in once you can delete
      # ADMIN_PASSWORD here (then the start step skips admin creation).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: LodgeMart Ops
      - key: ADMIN_PASSWORD                  # 12+ characters, not starting with "password"/"admin"/"lodgemart"
        sync: false
